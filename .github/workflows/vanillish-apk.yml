# Vanillish.apk — the whole build on one Linux runner (1× Actions minutes): cargo-ndk builds
# libvanillish.so (~35–45 min cold, ~15 warm from the cache), Gradle wraps it in the APK (~2 min).
#
#   apk      (read-only token)  the build, the checks on the library and the APK, the artifacts
#   release  (write token)      on a release only: the GitHub Release, with the APK attached
#
# Run it from the Actions tab (Run workflow) for a test build: the run's artifacts are the APK itself
# (not zipped: a phone opens it straight from the download) and the unstripped library. A release is
# either an annotated tag `vanillish-v*` pushed from a checkout, or Run workflow with `release` and
# `notes` filled in (GitHub then creates the tag). The `vanillish-` prefix keeps these apart from
# iNilla's `v*` tags, which inilla-ipa.yml builds into an .ipa on macOS.
#
# Signing — one key, forever: Android installs an update only over an app signed with the same key,
# and uninstalling to get past that deletes Vanillish's data (the game data, the settings, the
# SavedVariables). The key comes from four repository secrets:
#   VANILLISH_KEYSTORE_BASE64    the keystore file, base64 (`base64 -w0 vanillish.jks`)
#   VANILLISH_KEYSTORE_PASSWORD  its password
#   VANILLISH_KEY_ALIAS          the key's alias in it
#   VANILLISH_KEY_PASSWORD       optional: the key's own password (a PKCS12 keystore has none)
# Without them a test build is signed with the runner's throwaway debug key, and the run says so in
# a warning and in its summary; a release refuses to build at all.
name: vanillish-apk

on:
  workflow_dispatch:
    inputs:
      dev:
        description: "Compile benilla's dev instruments in (debug panel, perf HUD)"
        type: boolean
        default: false
      variant:
        description: "release (optimized Java) or debug (debuggable Java, id suffix .debug)"
        type: choice
        options: [release, debug]
        default: release
      release:
        description: "Publish as this release tag, e.g. vanillish-v0.1.0 (empty: a test build)"
        type: string
        default: ""
      notes:
        description: "Release text in Markdown; the first line is the title"
        type: string
        default: ""
  push:
    tags: ["vanillish-v*"]

concurrency:
  group: vanillish-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Hundreds of crates' build scripts run in this job: its token can read, nothing more, and it is
    # not left in .git/config. The release job below is the one that writes.
    permissions:
      contents: read
    outputs:
      release-tag: ${{ steps.kind.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50 # `git describe` for the build stamp
          persist-credentials: false

      - name: Release or test build
        id: kind
        # Decided first, so a release that cannot be one fails in seconds, not after the build.
        env:
          RELEASE: ${{ inputs.release }}
          VARIANT: ${{ inputs.variant || 'release' }}
          HAS_KEY: ${{ secrets.VANILLISH_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/vanillish-v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$RELEASE"; fi
          if [ -z "$TAG" ]; then
            echo "A test build ($VARIANT)."
            exit 0
          fi
          if [[ ! "$TAG" =~ ^vanillish-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A release tag must look like vanillish-v1.2.3, got: $TAG"
            exit 1
          fi
          if [ "$VARIANT" != release ]; then
            echo "::error::A release is the release variant, not $VARIANT."
            exit 1
          fi
          if [ "$HAS_KEY" != true ]; then
            echo "::error title=No signing key::A release must be signed with the Vanillish release key, and the VANILLISH_KEYSTORE_BASE64 secret is not set (see the top of .github/workflows/vanillish-apk.yml). A debug-signed release could never be updated by a properly signed one without an uninstall, which deletes the game data."
            exit 1
          fi
          {
            echo "VANILLISH_VERSION_NAME=${TAG#vanillish-v}"
            echo "VANILLISH_REQUIRE_RELEASE_KEY=1"
          } >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release $TAG."

      - name: Free disk space
        # Keeps /usr/local/lib/android: the SDK is what we build with.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

      - name: Toolchain
        # rust-toolchain.toml's release; the Android target comes with android/tools/ci-setup.sh.
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The `android` profile's build (Cargo.toml), one cache per feature set.
          shared-key: vanillish-apk-android-${{ inputs.dev && 'dev' || 'player' }}
          cache-targets: true
          cache-on-failure: true
          cache-bin: true # ~/.cargo/bin: cargo-ndk, built once

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Android NDK, SDK pieces, cargo-ndk
        run: android/tools/ci-setup.sh

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # the open-source GitHub Actions cache, not the commercial service

      - name: Build libvanillish.so
        # No secret is in this step's environment, nor the keystore on disk yet.
        env:
          VANILLISH_FEATURES: ${{ inputs.dev && 'dev' || '' }}
        run: android/build-rust.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VANILLISH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # $RUNNER_TEMP is emptied when the job ends.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/vanillish.keystore"
            echo "VANILLISH_KEYSTORE=$RUNNER_TEMP/vanillish.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning title=No signing key::No VANILLISH_KEYSTORE_BASE64 secret: this APK is signed with the runner's throwaway debug key. It cannot update an install of any other build (not even the previous run's), and uninstalling to make room deletes Vanillish's data. Add the signing secrets (see the top of .github/workflows/vanillish-apk.yml)."
          fi

      - name: Package Vanillish.apk
        env:
          VANILLISH_KEYSTORE_PASSWORD: ${{ secrets.VANILLISH_KEYSTORE_PASSWORD }}
          VANILLISH_KEY_ALIAS: ${{ secrets.VANILLISH_KEY_ALIAS }}
          VANILLISH_KEY_PASSWORD: ${{ secrets.VANILLISH_KEY_PASSWORD }}
          VANILLISH_SKIP_RUST: "1"
          VANILLISH_CI_BUILD: ${{ github.run_number }}
          VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          android/build-apk.sh "$VARIANT"
          # APK=, APK_NAME=, VERSION_NAME=, SIGNED_WITH=, … for the steps below.
          cat target/vanillish-out/build.env >> "$GITHUB_ENV"
          cat target/vanillish-out/build-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not zipped: the artifact is the APK, under its own name.
          path: ${{ env.APK }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The unstripped library and its commit, for llvm-symbolizer / ndk-stack on a tombstone.
          name: Vanillish-symbols-${{ env.COMMIT }}
          path: target/vanillish-out/symbols/
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.kind.outputs.tag != ''
        with:
          # Only for the release job.
          name: vanillish-release
          path: |
            ${{ env.APK }}
            target/vanillish-out/build-notes.md
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  release:
    needs: apk
    if: needs.apk.outputs.release-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vanillish-release
          path: dist

      - name: Release
        # The release text is the annotated tag's message, or the `notes` input (first line the
        # title); the build facts and install steps follow, then GitHub's generated changelog.
        # Pre-release until a build is marked tested by hand.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.apk.outputs.release-tag }}
          NOTES_IN: ${{ inputs.notes }}
        run: |
          APK=$(find dist -name 'Vanillish-*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::no APK in the vanillish-release artifact"; exit 1; }
          NOTES=dist/release-notes.md
          if [[ "$GITHUB_REF" == refs/tags/vanillish-v* ]]; then
            git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            SUBJECT=$(git tag -l --format='%(contents:subject)' "$TAG")
            git tag -l --format='%(contents:body)' "$TAG" > "$NOTES"
            WHERE=(--verify-tag)
          else
            SUBJECT=$(printf '%s\n' "$NOTES_IN" | head -n 1)
            printf '%s\n' "$NOTES_IN" | tail -n +2 > "$NOTES"
            WHERE=(--target "$GITHUB_SHA")
          fi
          { echo ""; cat "$(find dist -name build-notes.md | head -n 1)"; } >> "$NOTES"
          gh release create "$TAG" "$APK" "${WHERE[@]}" \
            --title "Vanillish ${TAG#vanillish-}${SUBJECT:+ — $SUBJECT}" \
            --notes-file "$NOTES" --generate-notes --prerelease
