[package]
name = "inilla-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iNilla: the iOS host glue (UIKit, GameController, Keychain, AVAudioSession) behind plain Rust calls, with desktop fallbacks"

[lints]
workspace = true

[dependencies]
inilla-core = { path = "../inilla-core" }
libc = "0.2"
crossbeam-channel = "0.5"

# The objc2 0.6 family: the one cpal's CoreAudio backend already brings, so the iOS graph carries
# no new copy of the runtime crate. Everything below is reached through `msg_send!` on classes
# looked up by name, which keeps the framework crates (and their compile time) out of the graph.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSValue", "NSError", "NSObject", "NSProcessInfo", "NSDictionary", "NSEnumerator"] }
block2 = "0.6"
security-framework = { version = "3", default-features = false }

# The desktop stand-in for the keychain (`keychain.rs`) is a TOML file (on Android, the map the
# Keystore seals).
[target.'cfg(not(target_os = "ios"))'.dependencies]
toml = "0.8"

# Vanillish: the Android host glue — JNI into the app's `Bridge` class (jni 0.21 is cpal's) and the
# JavaVM/Application android-activity publishes through ndk-context. Neither adds a crate.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Vanillish: the Windows host glue (`src/windows/`). windows-sys 0.59 (benilla-app's and arboard's)
# for the Win32 calls; windows 0.62 (cpal's and gilrs's) for the folder dialog's COM and the
# connection cost's WinRT; arboard 3 (benilla-app's text boxes') for the clipboard. None adds a crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Networking_Connectivity",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
arboard = { version = "3", default-features = false }
