[package]
name = "benilla-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bevy AssetSource + AssetLoaders over the WoW 1.12.1 MPQ patch chain"

[lints]
workspace = true

[features]
# The dev/player seam, on by default. `benilla-formats` comes in without default features and its
# `dev` is forwarded here, or unification would put it back in a player build.
default = ["dev"]
dev = ["benilla-formats/dev"]

[dependencies]
anyhow.workspace = true
bevy.workspace = true
benilla-formats = { path = "../benilla-formats", default-features = false }
# Nearest-neighbour resize of layer BLPs smaller than `LAYER_TEX_SIZE`: texel replication in gamma
# bytes, with no averaging to darken mid-tones.
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }

# Vanillish: the world shaders composed and validated as Bevy's shader cache would, with and
# without the modern lighting defs (`modern_light`). Both are already in the graph through Bevy;
# no feature is added, so no build of either changes.
[dev-dependencies]
naga = { version = "27", default-features = false }
naga_oil = { version = "0.20", default-features = false, features = ["test_shader"] }
