org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Vanillish: the version pins, in one place. app/build.gradle.kts reads them, and so do
# android/build-rust.sh and the vanillish-* workflows (`sed -n 's/^vanillish\.<name>=//p'`), so the
# Rust half and the Java half of the APK cannot drift apart. Keep them `key=value`, one per line.
#
# minSdk is also cargo-ndk's -P: the NDK links libvanillish.so against that API level's stubs, so a
# platform symbol newer than minSdk fails the link rather than the app's start. 31 (Android 12):
# AThermal headroom, VibratorManager, the cutout mode the game draws under.
vanillish.minSdk=31
vanillish.targetSdk=36
vanillish.compileSdk=36
vanillish.buildTools=36.0.0
# r28c: links 16 KB-aligned by default (build-rust.sh checks it), and AGP 9.4's own default.
vanillish.ndkVersion=28.2.13676358
# What CI installs (`cargo install cargo-ndk --locked --version …`); any 4.x builds the same.
vanillish.cargoNdk=4.1.2
# GameActivity comes in two halves that must be the same release: the Java one is this Maven
# artifact, the C one is compiled into libvanillish.so by android-activity's build script.
# build-rust.sh fails when Cargo.lock's android-activity is not vanillish.androidActivity; on an
# upgrade, read android-activity's README for its games-activity version and change both together.
vanillish.androidActivity=0.6.1
vanillish.gamesActivity=4.4.0
